name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - run: python -m pytest -q -p no:cacheprovider
      - run: python -m compileall -q hooks evals scripts install.py
      - name: PowerShell wrapper smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sandbox = Join-Path $env:RUNNER_TEMP 'baton-home'
          New-Item -ItemType Directory -Force -Path $sandbox | Out-Null
          $env:HOME = $sandbox
          $env:USERPROFILE = $sandbox
          ./install.ps1 | Out-Null
          $status = ./skill/scripts/baton_status.ps1 | ConvertFrom-Json
          if (-not $status.root) { throw 'status wrapper returned no repository root' }

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: bash -n install.sh scripts/baton_next.sh skill/scripts/baton_status.sh evals/*.sh
      - run: shellcheck install.sh scripts/baton_next.sh skill/scripts/baton_status.sh evals/*.sh
